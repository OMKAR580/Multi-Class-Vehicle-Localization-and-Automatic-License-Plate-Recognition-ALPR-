name: Feature Request
description: Propose an idea or feature for the ALPR platform
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: input
    id: component
    attributes:
      label: Target Component
      description: Frontend, Backend, Android, AI, Infrastructure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Context
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features considered.
